name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 00:00 every Wednesday and Sunday
    - cron: '0 0 * * 0,3'
  workflow_dispatch: # Allows you to run this manually from the GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent pausing
        run: |
          echo "Pinging Supabase REST API..."
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo -e "\nPing complete!"
